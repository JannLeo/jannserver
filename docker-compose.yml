services:
  app:
    build: .
    restart: always
    init: true
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/app.db
      - SESSION_SECRET=${SESSION_SECRET}
      - INIT_TOKEN=${INIT_TOKEN}
      - HERDR_API_KEY=${HERDR_API_KEY:-}
      - DELEGATION_API_KEY=${DELEGATION_API_KEY:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - ALLOW_HTTP_COOKIES=${ALLOW_HTTP_COOKIES:-false}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_ATTEMPTS=${RATE_LIMIT_MAX_ATTEMPTS:-5}
    volumes:
      - ./data:/data:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"database\":\"ok\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 15s

networks:
  default:
    name: workspace-net

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 8.15.9
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:gateway
      - name: Production build
        env:
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789abcdef
          INIT_TOKEN: ci-only-init-token
          DB_PATH: /tmp/jannserver-ci/app.db
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: pnpm build
